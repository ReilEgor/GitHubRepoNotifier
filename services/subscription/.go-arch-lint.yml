version: 3
workdir: ./

allow:
  depOnAnyVendor: false
  deepScan: false
  ignoreNotFoundComponents: false

excludeFiles:
  - '_test\.go$'

vendors:
  uuid:
    in:
      - github.com/google/uuid
  shared-common:
    in:
      - github.com/ReilEgor/GitHubRepoNotifier/shared/ctxlog
      - github.com/ReilEgor/GitHubRepoNotifier/shared/contracts
  shared-model:
    in:
      - github.com/ReilEgor/GitHubRepoNotifier/shared/domain/**
  shared-infra:
    in:
      - github.com/ReilEgor/GitHubRepoNotifier/shared/buildinfo
      - github.com/ReilEgor/GitHubRepoNotifier/shared/config
      - github.com/ReilEgor/GitHubRepoNotifier/shared/infrastructure/**

commonVendors:
  - shared-common

components:
  model:            { in: internal/domain/model/** }
  repository-iface: { in: internal/domain/repository/** }
  usecase-iface:    { in: internal/domain/usecase/** }
  usecase-impl:     { in: internal/usecase/** }
  saga:             { in: internal/saga/** }
  repository-impl:  { in: internal/repository/** }
  infrastructure:   { in: internal/infrastructure/** }
  transport-http:       { in: internal/transport/http }
  transport-dto:        { in: internal/transport/http/dto }
  transport-middleware: { in: internal/transport/http/middleware }
  transport-grpc:       { in: internal/transport/grpc }
  transport-broker:     { in: internal/transport/broker/** }
  cmd:              { in: cmd/** }

deps:
  repository-iface:
    mayDependOn: [model]
    canUse: [shared-model]

  usecase-iface:
    mayDependOn: [model]

  usecase-impl:
    mayDependOn: [model, repository-iface, usecase-iface, saga]
    canUse: [uuid]

  saga:
    mayDependOn: [model, repository-iface]

  repository-impl:
    mayDependOn: [model, repository-iface]
    anyVendorDeps: true

  infrastructure:
    mayDependOn: [model, repository-iface, usecase-iface]
    anyVendorDeps: true

  transport-http:
    mayDependOn: [model, usecase-iface, transport-dto, transport-middleware]
    anyVendorDeps: true

  transport-dto:
    mayDependOn: [model]
    anyVendorDeps: true

  transport-middleware:
    mayDependOn: [model, transport-dto]
    anyVendorDeps: true

  transport-grpc:
    mayDependOn: [model, usecase-iface]
    anyVendorDeps: true

  transport-broker:
    mayDependOn: [model, usecase-iface]
    anyVendorDeps: true

  cmd:
    anyProjectDeps: true
    anyVendorDeps: true
