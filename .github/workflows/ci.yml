name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - services/subscription
          - services/tracking
          - services/notification
          - shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Run golangci-lint (${{ matrix.module }})
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.1
          working-directory: ${{ matrix.module }}
          args: --timeout=5m --build-tags integration
      - name: Install go-arch-lint
        run: go install github.com/fe3dback/go-arch-lint@v1.15.0
      - name: Run go-arch-lint (${{ matrix.module }})
        run: go-arch-lint check --project-path ./${{ matrix.module }}

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Run unit tests (no Docker)
        run: make unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Run integration tests on PostgreSQL in Testcontainers
        run: make test-integration

  generated-code:
    name: Generated Code Is Up To Date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Install pinned tools
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          make setup
      - name: Regenerate protobuf and wire code and fail on any difference
        run: make generate-check

  smoke:
    name: Smoke Test on Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Migrate, start every service and walk through the user flow
        run: make smoke

  e2e:
    name: End-to-End Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Start the system on Docker Compose and run the Playwright tests
        run: make e2e
      - name: Keep the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Measure statement coverage of unit and integration tests
        run: make cover | tee coverage-summary.txt
      - name: Show the numbers in the job summary
        if: always()
        run: |
          {
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Install pinned tools
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          make setup
      - name: Run gremlins on the critical packages
        run: make mutation
      - name: Keep the mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports
          path: reports/mutation
          if-no-files-found: ignore
