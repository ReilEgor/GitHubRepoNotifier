name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - services/subscription
          - services/tracking
          - services/notification
          - shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Run golangci-lint (${{ matrix.module }})
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.1
          working-directory: ${{ matrix.module }}
          args: --timeout=5m --build-tags integration
      - name: Install go-arch-lint
        run: go install github.com/fe3dback/go-arch-lint@v1.15.0
      - name: Run go-arch-lint (${{ matrix.module }})
        run: go-arch-lint check --project-path ./${{ matrix.module }}

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Run unit tests (no Docker)
        run: make unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Run integration tests on PostgreSQL in Testcontainers
        run: make test-integration

  generated-code:
    name: Generated Code Is Up To Date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Install pinned tools
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          make setup
      - name: Regenerate protobuf and wire code and fail on any difference
        run: make generate-check

  smoke:
    name: Smoke Test on Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Migrate, start every service and walk through the user flow
        run: make smoke
